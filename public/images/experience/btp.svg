<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Illustration : bâtiment et travaux publics">
  <title>Illustration — Bâtiment et Travaux Publics</title>
  <defs>
    <linearGradient id="btpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a63"/>
      <stop offset="1" stop-color="#080F49"/>
    </linearGradient>
    <linearGradient id="btpMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13B8CE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#13B8CE" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#btpBg)"/>

  <!-- trame de fond -->
  <g stroke="#13B8CE" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
  </g>

  <!-- grue -->
  <g stroke="#13B8CE" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M150 330V120M150 120h190M340 120v40"/>
    <path d="M150 120l-40 40M150 120l40 40" stroke-width="4" stroke-opacity="0.55"/>
  </g>
  <rect x="132" y="330" width="36" height="12" rx="4" fill="#13B8CE" fill-opacity="0.55"/>
  <rect x="332" y="160" width="16" height="22" rx="4" fill="#13B8CE"/>

  <!-- bâtiments -->
  <g fill="url(#btpMask)">
    <rect x="360" y="210" width="86" height="120" rx="6"/>
    <rect x="462" y="160" width="70" height="170" rx="6"/>
    <rect x="546" y="240" width="58" height="90" rx="6"/>
  </g>
  <g fill="#080F49" fill-opacity="0.55">
    <rect x="374" y="228" width="16" height="16" rx="3"/>
    <rect x="404" y="228" width="16" height="16" rx="3"/>
    <rect x="374" y="258" width="16" height="16" rx="3"/>
    <rect x="404" y="258" width="16" height="16" rx="3"/>
    <rect x="476" y="180" width="18" height="18" rx="3"/>
    <rect x="508" y="180" width="18" height="18" rx="3"/>
    <rect x="476" y="214" width="18" height="18" rx="3"/>
    <rect x="508" y="214" width="18" height="18" rx="3"/>
    <rect x="476" y="248" width="18" height="18" rx="3"/>
    <rect x="508" y="248" width="18" height="18" rx="3"/>
    <rect x="560" y="258" width="14" height="14" rx="3"/>
    <rect x="584" y="258" width="14" height="14" rx="3"/>
  </g>

  <!-- échafaudage -->
  <g stroke="#13B8CE" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M58 330V228h74v102M58 262h74M58 296h74"/>
  </g>

  <!-- sol -->
  <path d="M0 330h640" stroke="#13B8CE" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 330h640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12"/>

  <!-- bande de chantier -->
  <g opacity="0.75">
    <path d="M0 352h640" stroke="#13B8CE" stroke-width="8" stroke-dasharray="18 14"/>
  </g>
</svg>
