<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Illustration : fournitures vivrières">
  <title>Illustration — Fournitures vivrières</title>
  <defs>
    <linearGradient id="vivBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a63"/>
      <stop offset="1" stop-color="#080F49"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13B8CE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#13B8CE" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#vivBg)"/>

  <!-- trame -->
  <g stroke="#13B8CE" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
  </g>

  <!-- soleil / horizon -->
  <circle cx="500" cy="110" r="46" fill="#13B8CE" fill-opacity="0.18"/>
  <circle cx="500" cy="110" r="46" fill="none" stroke="#13B8CE" stroke-width="3" stroke-opacity="0.5"/>

  <!-- sacs de vivres -->
  <g>
    <path d="M196 330v-84c0-18 14-30 30-38l-12-18h44l-12 18c16 8 30 20 30 38v84z" fill="url(#sack)"/>
    <path d="M216 250h60M216 278h60" stroke="#080F49" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
    <path d="M282 330v-66c0-14 12-24 26-30l-10-16h38l-10 16c14 6 26 16 26 30v66z" fill="#13B8CE" fill-opacity="0.45"/>
    <path d="M300 276h50M300 300h50" stroke="#080F49" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
    <path d="M128 330v-52c0-12 10-20 22-26l-9-14h34l-9 14c12 6 22 14 22 26v52z" fill="#13B8CE" fill-opacity="0.3"/>
  </g>

  <!-- calebasse / bol de grain -->
  <g>
    <path d="M352 322c0 14 26 26 58 26s58-12 58-26z" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M352 322c0-14 26-24 58-24s58 10 58 24" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
    <g fill="#13B8CE">
      <circle cx="386" cy="316" r="5"/>
      <circle cx="404" cy="308" r="5" fill-opacity="0.8"/>
      <circle cx="424" cy="314" r="5" fill-opacity="0.65"/>
      <circle cx="444" cy="308" r="5" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- plants de mil -->
  <g stroke="#13B8CE" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M104 330V182"/>
    <path d="M104 236l-26-26M104 236l26-26M104 272l-26-26M104 272l26-26"/>
    <path d="M164 330V226"/>
    <path d="M164 266l-20-20M164 266l20-20"/>
  </g>
  <g fill="#13B8CE">
    <ellipse cx="104" cy="170" rx="11" ry="19"/>
    <ellipse cx="78" cy="204" rx="10" ry="17" transform="rotate(-28 78 204)" fill-opacity="0.9"/>
    <ellipse cx="130" cy="204" rx="10" ry="17" transform="rotate(28 130 204)" fill-opacity="0.9"/>
    <ellipse cx="78" cy="242" rx="10" ry="17" transform="rotate(-28 78 242)" fill-opacity="0.7"/>
    <ellipse cx="130" cy="242" rx="10" ry="17" transform="rotate(28 130 242)" fill-opacity="0.7"/>
    <ellipse cx="164" cy="214" rx="9" ry="15"/>
    <ellipse cx="144" cy="242" rx="8" ry="13" transform="rotate(-28 144 242)" fill-opacity="0.65"/>
    <ellipse cx="184" cy="242" rx="8" ry="13" transform="rotate(28 184 242)" fill-opacity="0.65"/>
  </g>

  <!-- sol -->
  <path d="M0 330h640" stroke="#13B8CE" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 330h640" stroke="#ffffff" stroke-opacity="0.1" stroke-width="14"/>
</svg>
